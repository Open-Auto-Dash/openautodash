plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.openautodash'
    compileSdk 36

    defaultConfig {
        applicationId "com.openautodash"
        minSdk 26
        targetSdk 36
        versionCode 137
        versionName "0.7.23"

        manifestPlaceholders = [
                redirectSchemeName: "spotify-sdk-open-autodash",
                redirectHostName: "auth",
                redirectPathPattern: "/callback",
        ]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true
    }
}

configurations.configureEach {
    exclude group: 'com.google.android.gms', module: 'play-services-maps'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.browser:browser:1.9.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.8.0')
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    // Google Navigation & Location
    implementation 'com.google.android.libraries.navigation:navigation:7.3.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Places
    implementation 'com.google.android.libraries.places:places:5.1.1'

    // Maps Utils (Updated to 3.8.2 and excluded maps just in case)
    implementation ('com.google.maps.android:android-maps-utils:4.0.0') {
        exclude group: 'com.google.android.gms', module: 'play-services-maps'
    }

    // Google Maps Services (Java Client)
    implementation 'com.google.maps:google-maps-services:2.2.0'

    // Networking & JSON
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation "com.google.code.gson:gson:2.13.2"

    // Spotify
    implementation 'com.spotify.android:auth:3.0.0'
    implementation files('../libs/spotify-app-remote-release-0.7.2.aar')

    // Lifecycle Components
    def lifecycle_version = "2.10.0"  // Using a stable version
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"

    // Room
    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
}